name: Check Auth Domains Temp

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        id: auth
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          token_format: 'access_token'

      - name: Get Identity Toolkit config (authorized domains)
        run: |
          TOKEN="${{ steps.auth.outputs.access_token }}"
          curl -s -X GET \
            -H "Authorization: Bearer $TOKEN" \
            "https://identitytoolkit.googleapis.com/v2/projects/kaderin-sesi/config" | tee /tmp/config.json
          echo "---"
          echo "---OAuth IdP configs---"
          curl -s -X GET \
            -H "Authorization: Bearer $TOKEN" \
            "https://identitytoolkit.googleapis.com/v2/projects/kaderin-sesi/defaultSupportedIdpConfigs/google.com" | tee /tmp/idp.json
